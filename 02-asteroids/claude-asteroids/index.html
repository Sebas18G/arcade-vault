<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asteroids</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .board-wrap {
      position: relative;
    }
    canvas {
      display: block;
      border: 1px solid #222;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
    }
    .hidden {
      display: none;
    }
    .overlay-box {
      text-align: center;
      font-family: monospace;
      color: #fff;
      min-width: 320px;
    }
    .overlay-title {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 6px;
      margin-bottom: 20px;
    }
    .overlay-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .overlay-actions button {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: bold;
      font-family: monospace;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .overlay-actions button:hover {
      opacity: 0.8;
    }
    #restart-btn, #controls-btn, #back-btn {
      background: transparent;
      color: #fff;
      border: 1px solid #666;
    }
    .controls-list {
      list-style: none;
      text-align: left;
      margin: 4px 0 24px;
      font-size: 13px;
      line-height: 1.9;
      color: rgba(255, 255, 255, 0.85);
    }
    .controls-list .key {
      display: inline-block;
      min-width: 100px;
      color: #fff;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .level-select {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .level-select-label {
      font-size: 12px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.6);
    }
    .level-select-control {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .level-select-control button {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 1px solid #666;
      background: transparent;
      color: #fff;
      font-family: monospace;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .level-select-control button:hover {
      opacity: 0.8;
    }
    .level-select-control button:disabled {
      opacity: 0.3;
      cursor: default;
    }
    #level-value {
      min-width: 24px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="board-wrap">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <div id="pause-main">
          <p class="overlay-title">PAUSA</p>
          <div class="overlay-actions">
            <button id="resume-btn">Reanudar</button>
            <button id="restart-btn">Reiniciar</button>
            <button id="controls-btn">Ver controles</button>
          </div>
          <div class="level-select">
            <span class="level-select-label">NIVEL INICIAL (próxima partida)</span>
            <div class="level-select-control">
              <button id="level-dec" aria-label="Nivel inicial anterior">−</button>
              <span id="level-value">1</span>
              <button id="level-inc" aria-label="Nivel inicial siguiente">+</button>
            </div>
          </div>
        </div>
        <div id="pause-controls" class="hidden">
          <p class="overlay-title">CONTROLES</p>
          <ul class="controls-list">
            <li><span class="key">&larr; / &rarr;</span> Girar la nave</li>
            <li><span class="key">&uarr;</span> Impulso</li>
            <li><span class="key">ESPACIO</span> Disparar</li>
            <li><span class="key">P / ESC</span> Pausar / reanudar</li>
          </ul>
          <div class="overlay-actions">
            <button id="back-btn">Volver</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
