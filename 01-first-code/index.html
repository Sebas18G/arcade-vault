<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi primera página web</title>
        <style>
            /* Fondo gris claro para toda la página */
            body {
                background-color: #f0f0f0;
                color: #000;
                margin: 0;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            }
        </style>
    </head>
    <body>
        <main style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
            <div id="counter-container" style="background: #fff; padding:1.25rem 1.5rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.06); display:flex; align-items:center; gap:0.75rem;">
                <button id="btn-decrement" aria-label="Disminuir" style="padding:0.5rem 0.85rem;">Menos</button>
                <div id="counter" style="min-width:3ch; text-align:center; font-size:1.5rem; font-weight:700;">
                    <span id="count">0</span>
                </div>
                <button id="btn-increment" aria-label="Aumentar" style="padding:0.5rem 0.85rem;">Más</button>
            </div>
        </main>
    </body>
    <script>
        (function () {
            const countEl = document.getElementById('count');
            const incBtn = document.getElementById('btn-increment');
            const decBtn = document.getElementById('btn-decrement');
            let value = 0;
            function render() { countEl.textContent = value; }
            incBtn.addEventListener('click', () => { value += 1; render(); });
            decBtn.addEventListener('click', () => { value -= 1; render(); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') { value += 1; render(); }
                if (e.key === 'ArrowDown') { value -= 1; render(); }
            });
            render();
        })();
    </script>
</html>
